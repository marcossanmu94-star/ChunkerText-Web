<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChunkerText</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 id="sidebar-title">Projects</h2>
        <button id="toggle-sidebar-btn" class="btn icon-btn" title="Toggle Sidebar">◀</button>
      </div>
      <div class="sidebar-content">
        <button id="new-project-btn" class="btn primary-btn full-width">+ New Project</button>
        <ul id="project-list" class="project-list">
          <!-- Projects rendered here -->
        </ul>
      </div>
      <div class="sidebar-footer">
        <button id="import-btn" class="btn secondary-btn">Import</button>
        <button id="export-btn" class="btn secondary-btn">Export</button>
      </div>
    </aside>

    <main class="main-content">
      <div id="no-project-view" class="view hidden">
        <h2>No Project Selected</h2>
        <p>Select a project from the sidebar or create a new one.</p>
      </div>

      <div id="project-view" class="view hidden">
        <header class="project-header">
          <div class="header-left">
            <button id="show-sidebar-btn" class="btn icon-btn hidden" title="Show Sidebar">▶</button>
            <h1 id="current-project-name" contenteditable="true" spellcheck="false">Project Name</h1>
          </div>
          <div class="header-actions" style="display: flex; gap: 8px; align-items: center;">
            <button id="open-full-screen-btn" class="btn icon-btn" title="Toggle Fullscreen (⤢)">⤢</button>
            <button id="open-side-window-btn" class="btn icon-btn" title="Open as Floating Side Window (◧)">◧</button>
            <button id="delete-project-btn" class="btn danger-btn">Delete Project</button>
          </div>
        </header>

        <div class="workspace">
          <!-- Variables Section -->
          <section class="section variables-section">
            <div class="section-header">
              <h2>Variables</h2>
              <div style="display: flex; gap: 8px;">
                <button id="toggle-all-vars-btn" class="btn secondary-btn">Collapse All</button>
                <button id="add-variable-btn" class="btn primary-btn">+ Variable</button>
              </div>
            </div>
            <div id="variables-list" class="variables-list">
              <!-- Variables inputs rendered here -->
            </div>
          </section>

          <!-- Blocks Section -->
          <section class="section blocks-section">
            <div class="section-header">
              <h2>Master Blocks</h2>
              <div style="display: flex; gap: 8px;">
                <button id="toggle-all-blocks-btn" class="btn secondary-btn">Collapse All</button>
                <button id="add-block-btn" class="btn primary-btn">+ New Block</button>
              </div>
            </div>
            <div id="blocks-list" class="blocks-list">
              <!-- Master blocks rendered here -->
            </div>
          </section>

          <!-- New Text Section -->
          <section class="section new-text-section">
            <div class="section-header">
              <h2>New Text</h2>
              <div style="display: flex; gap: 8px;">
                <button id="toggle-all-new-text-btn" class="btn secondary-btn">Collapse All</button>
                <button id="add-blank-block-btn" class="btn secondary-btn">+ Blank Block</button>
                <button id="clear-new-text-btn" class="btn danger-btn">Clear</button>
              </div>
            </div>
            <div id="new-text-list" class="new-text-list">
              <!-- Composed blocks dragged/added here -->
            </div>
            <div class="new-text-footer">
              <button id="copy-all-btn" class="btn primary-btn large-btn">Copy to Clipboard</button>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- Custom Context Menu for Inserting Variables -->
  <div id="custom-context-menu" class="custom-context-menu hidden">
    <div class="context-menu-header">Insert Variable</div>
    <div id="context-menu-vars-list" class="context-menu-list"></div>
  </div>

  <script src="Sortable.min.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
